<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboV Gaming Network</title>
    <style>
        /* Reset and basic styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1117;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Header / Hero Section */
        header {
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 3px solid #ff4655;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-top: 0.5rem;
        }

        /* Container Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        /* Section Styling */
        .section-title {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: #ff4655;
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }

        /* Server Grid & Cards */
        .servers-grid {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .server-card {
            background-color: #1a1d26;
            border: 1px solid #2d3243;
            border-radius: 12px;
            width: 320px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .server-card:hover {
            transform: translateY(-8px);
            border-color: #ff4655;
            box-shadow: 0 10px 25px rgba(255, 70, 85, 0.2);
        }

        .server-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 1.5rem;
            border-radius: 8px;
        }

        .server-card h3 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .server-card .subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ff4655;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        /* Button Container & Buttons */
        .card-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            display: block;
            padding: 0.8rem 1.5rem;
            background-color: #ff4655;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #e03e4d;
        }

        .btn-discord {
            background-color: #5865F2;
        }

        .btn-discord:hover {
            background-color: #4752C4;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #090a0e;
            color: #6b7280;
            font-size: 0.9rem;
            border-top: 1px solid #1f2430;
            margin-top: 4rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        .footer-link {
            color: #5865F2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #7983f5;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>TurboV Gaming Network</h1>
        <p>Your Ultimate Gaming Community</p>
    </header>

    <!-- Main Content Container -->
    <div class="container">
        
        <!-- Game Servers Section -->
        <section id="servers">
            <h2 class="section-title">Game Servers</h2>
            
            <div class="servers-grid">
                <!-- Australian Roleplay Card -->
                <div class="server-card">
                    <img src="AURP.png" alt="Australian Roleplay Logo" class="server-logo">
                    <h3>Australian Roleplay</h3>
                    <p class="subtitle">FiveM/GTARP</p>
                    <div class="card-buttons">
                        <a href="https://cfx.re/join/5ooy8lr" class="btn" target="_blank">Connect Now</a>
                        <a href="https://discord.gg/CVedgwW4W4" class="btn btn-discord" target="_blank">Join Discord</a>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; TurboV Gaming Network. All rights reserved.</p>
        <p><a href="https://discord.gg/Vav64w87Sd" class="footer-link" target="_blank">TurboV website Discord server</a></p>
    </footer>

</body>
</html>
