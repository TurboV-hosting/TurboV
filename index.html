<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Under Construction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: message on the left, a pencil sketch of a half-built building and crane on the right; stacks on phones. Graph-paper ground, one marker-yellow highlight as the bold move. */
:root {
  --paper: #e9eef1;
  --grid: #d5dde2;
  --ink: #1c2733;
  --ink-soft: #4f5e6b;
  --marker: #f6c83a;
  --on-marker: #1c2733;
  --pencil: #d4452f;
  --font-display: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --font-body: 'Kalam', 'Segoe Print', 'Comic Sans MS', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151c23;
    --grid: #202a33;
    --ink: #e7edf0;
    --ink-soft: #9aa8b4;
    --marker: #f0c030;
    --on-marker: #1c2733;
    --pencil: #ff7a62;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151c23;
  --grid: #202a33;
  --ink: #e7edf0;
  --ink-soft: #9aa8b4;
  --marker: #f0c030;
  --on-marker: #1c2733;
  --pencil: #ff7a62;
  color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(28px, 8vw, 88px);
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: clamp(24px, 5vw, 56px);
  align-items: center;
}
.copy { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }

.status {
  display: inline-block;
  margin: 0;
  padding: 2px 14px 4px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.7rem;
  line-height: 1.1;
  color: var(--pencil);
  border: 2.5px dashed var(--pencil);
  border-radius: 14px 4px 12px 5px;
  transform: rotate(-1.8deg);
  animation: pop .6s cubic-bezier(.3,1.6,.5,1) .1s backwards;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.7rem, 7.4vw, 4.9rem);
  line-height: 1.02;
  letter-spacing: -0.01em;
  text-wrap: balance;
  animation: rise .7s ease .3s backwards;
}
mark {
  display: inline;
  padding: 0 .16em;
  margin: 0 -.06em;
  color: var(--on-marker);
  background-color: transparent;
  background-image: linear-gradient(var(--marker), var(--marker));
  background-repeat: no-repeat;
  background-position: 0 72%;
  background-size: 100% 86%;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  border-radius: 4px 10px 6px 12px;
  animation: sweep 1s cubic-bezier(.6,.1,.2,1) 1s backwards;
}

.note {
  margin: 0;
  max-width: 32ch;
  color: var(--ink-soft);
  font-size: 1.15rem;
  animation: rise .7s ease .55s backwards;
}

.progress { width: min(100%, 420px); display: flex; flex-direction: column; gap: 8px; animation: rise .7s ease .75s backwards; }
.bar {
  height: 26px;
  border: 3px solid var(--ink);
  border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
  overflow: hidden;
  background: transparent;
}
.bar span {
  display: block;
  height: 100%;
  width: 62%;
  background-color: var(--marker);
  background-image: linear-gradient(45deg, var(--ink) 25%, transparent 25%, transparent 50%, var(--ink) 50%, var(--ink) 75%, transparent 75%);
  background-size: 34px 34px;
  animation: grow 7s ease-in-out infinite alternate, march 1s linear infinite;
}
.bar-label { margin: 0; font-size: 1rem; color: var(--ink-soft); }
.dots i { font-style: normal; display: inline-block; animation: blink 1.3s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }

/* Sketch */
.sketch { width: 100%; max-width: 520px; height: auto; justify-self: center; overflow: visible; }
.ink { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ink .thin { stroke-width: 2; }
.ink .rebar { stroke: var(--pencil); stroke-width: 3; }
.draw { stroke-dasharray: 1 2; animation: draw 1.2s ease var(--d, 0s) backwards; }
.ink .win { fill: var(--marker); fill-opacity: 0; animation: draw 1s ease var(--d, 0s) backwards, win 9s linear var(--w, 3s) infinite backwards; }
.ink .win.on { fill-opacity: 1; }
.swing { transform-origin: 310px 76px; animation: swing 2.8s ease-in-out infinite alternate; }
.hang { animation: fade .6s ease 1.9s backwards; }
.cable { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; fill: none; }
.board { fill: var(--marker); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.sign-text { font-family: var(--font-display); font-weight: 700; font-size: 36px; fill: var(--on-marker); text-anchor: middle; }
.anno { font-family: var(--font-display); font-weight: 600; font-size: 25px; fill: var(--pencil); animation: fade .8s ease 3s backwards; }

@keyframes draw { from { stroke-dashoffset: 1.05; } to { stroke-dashoffset: 0; } }
@keyframes win { 0%, 6% { fill-opacity: 0; } 14%, 78% { fill-opacity: 1; } 88%, 100% { fill-opacity: 0; } }
@keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: rotate(-1.8deg) scale(.6); } to { opacity: 1; transform: rotate(-1.8deg) scale(1); } }
@keyframes sweep {
  0% { background-size: 0% 86%; color: var(--ink); }
  45% { color: var(--ink); }
  60% { color: var(--on-marker); }
  100% { background-size: 100% 86%; color: var(--on-marker); }
}
@keyframes grow { from { width: 18%; } to { width: 84%; } }
@keyframes march { to { background-position: 34px 0; } }
@keyframes blink { 0%, 60%, 100% { opacity: .15; } 30% { opacity: 1; } }

@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .sketch { max-width: 440px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<main class="wrap">
  <section class="copy">
    <p class="status">Status: building</p>
    <h1>Sorry but this website is currently <mark>under construction</mark></h1>
    <p class="note">Someone is up a ladder with a hammer right now. Please check back soon.</p>
    <div class="progress">
      <div class="bar" role="progressbar" aria-label="Construction in progress" aria-valuetext="Work in progress"><span></span></div>
      <p class="bar-label">Hammering away<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
    </div>
  </section>

  <svg class="sketch" viewBox="0 0 500 440" role="img" aria-label="Pencil sketch of a half-built building with scaffolding and a crane lifting a sign that says soon">
    <defs>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>

    <g class="ink" filter="url(#wobble)">
      <!-- ground -->
      <path class="draw" pathLength="1" style="--d:.1s" d="M10 392 C120 389 230 394 340 391 S470 392 490 390"/>

      <!-- scaffold posts, planks and zigzag braces -->
      <path class="draw thin" pathLength="1" style="--d:.3s" d="M56 392 L57 118"/>
      <path class="draw thin" pathLength="1" style="--d:.4s" d="M248 392 L247 118"/>
      <path class="draw thin" pathLength="1" style="--d:.6s" d="M50 312 L254 313"/>
      <path class="draw thin" pathLength="1" style="--d:.7s" d="M50 232 L254 231"/>
      <path class="draw thin" pathLength="1" style="--d:.8s" d="M50 152 L254 153"/>
      <path class="draw thin" pathLength="1" style="--d:.9s" d="M56 392 L80 352 L56 312 L80 272 L56 232 L80 192 L56 152"/>
      <path class="draw thin" pathLength="1" style="--d:1s" d="M248 392 L224 352 L248 312 L224 272 L248 232 L224 192 L248 152"/>

      <!-- building walls and floors -->
      <path class="draw" pathLength="1" style="--d:.5s" d="M80 392 L80 152 L224 152 L224 392"/>
      <path class="draw" pathLength="1" style="--d:.9s" d="M80 312 L224 312"/>
      <path class="draw" pathLength="1" style="--d:1.1s" d="M80 232 L224 232"/>

      <!-- door -->
      <path class="draw" pathLength="1" style="--d:1.3s" d="M136 392 L136 352 Q152 338 168 352 L168 392"/>

      <!-- windows: lights come on floor by floor -->
      <rect class="win on" pathLength="1" x="92" y="328" width="22" height="26" rx="2" style="--d:1.4s;--w:2.6s"/>
      <rect class="win on" pathLength="1" x="190" y="328" width="22" height="26" rx="2" style="--d:1.45s;--w:3.2s"/>
      <rect class="win on" pathLength="1" x="92" y="250" width="22" height="26" rx="2" style="--d:1.5s;--w:3.8s"/>
      <rect class="win" pathLength="1" x="141" y="250" width="22" height="26" rx="2" style="--d:1.55s;--w:4.4s"/>
      <rect class="win" pathLength="1" x="190" y="250" width="22" height="26" rx="2" style="--d:1.6s;--w:5s"/>
      <rect class="win" pathLength="1" x="92" y="170" width="22" height="26" rx="2" style="--d:1.65s;--w:5.6s"/>
      <rect class="win" pathLength="1" x="141" y="170" width="22" height="26" rx="2" style="--d:1.7s;--w:6.2s"/>
      <rect class="win" pathLength="1" x="190" y="170" width="22" height="26" rx="2" style="--d:1.75s;--w:6.8s"/>

      <!-- rebar poking out of the roof -->
      <path class="draw rebar" pathLength="1" style="--d:1.8s" d="M96 152 L97 132"/>
      <path class="draw rebar" pathLength="1" style="--d:1.9s" d="M152 152 L151 126"/>
      <path class="draw rebar" pathLength="1" style="--d:2s" d="M208 152 L209 134"/>

      <!-- brick pile -->
      <rect class="draw thin" pathLength="1" style="--d:1.6s" x="284" y="378" width="24" height="14" rx="1"/>
      <rect class="draw thin" pathLength="1" style="--d:1.7s" x="310" y="378" width="24" height="14" rx="1"/>
      <rect class="draw thin" pathLength="1" style="--d:1.8s" x="297" y="364" width="24" height="14" rx="1"/>

      <!-- crane tower, jib and counterweight -->
      <path class="draw" pathLength="1" style="--d:.8s" d="M372 392 L372 92"/>
      <path class="draw" pathLength="1" style="--d:.9s" d="M396 392 L396 92"/>
      <path class="draw thin" pathLength="1" style="--d:1.4s" d="M372 392 L396 362 L372 332 L396 302 L372 272 L396 242 L372 212 L396 182 L372 152 L396 122 L372 92"/>
      <path class="draw" pathLength="1" style="--d:1.2s" d="M190 71 L466 68"/>
      <path class="draw thin" pathLength="1" style="--d:1.5s" d="M372 70 L384 38 L396 69"/>
      <path class="draw thin" pathLength="1" style="--d:1.6s" d="M384 38 L200 70"/>
      <path class="draw thin" pathLength="1" style="--d:1.6s" d="M384 38 L466 68"/>
      <path class="draw" pathLength="1" style="--d:1.7s" d="M438 69 L438 98 L466 98 L466 68"/>
      <path class="draw thin" pathLength="1" style="--d:1.9s" d="M444 76 L460 92 M444 90 L458 76"/>
      <path class="draw" pathLength="1" style="--d:1.5s" d="M300 66 L320 66 L320 76 L300 76 Z"/>
    </g>

    <!-- sign lifted by the crane -->
    <g class="swing">
      <g class="hang">
        <path class="cable" d="M310 76 L272 126"/>
        <path class="cable" d="M310 76 L348 126"/>
        <rect class="board" x="268" y="126" width="84" height="40" rx="4"/>
        <text class="sign-text" x="310" y="156">soon</text>
      </g>
    </g>

    <text class="anno" x="80" y="424">walls are up, roof next</text>
  </svg>
</main>

</body></html>
