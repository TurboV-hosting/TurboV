<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboV Gaming Network</title>
    <style>
        /* Modern Reset & Root Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-hover: rgba(255, 255, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Subtle Animated Background Grid */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        /* Hero / Header Section */
        header {
            padding: 6rem 2rem 4rem;
            text-align: center;
            position: relative;
            animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            flex-grow: 1;
            width: 100%;
        }

        /* Section Titles */
        .section-title {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-secondary);
            position: relative;
            animation: fadeIn 1.2s ease-out;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background: #ffffff;
            margin: 0.75rem auto 0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Server Grid & Modern Glass Cards */
        .servers-grid {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .server-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 340px;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .server-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px -15px var(--accent-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        .server-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.1));
            transition: transform 0.4s ease;
        }

        .server-card:hover .server-logo {
            transform: scale(1.05);
        }

        .server-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .server-card .subtitle {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        /* Button Styling & Animated States */
        .card-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .btn {
            display: block;
            padding: 0.85rem 1.5rem;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border-radius: 8px;
            border: 1px solid #ffffff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background-color: #000000;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .btn-discord {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid var(--border-color);
        }

        .btn-discord:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: none;
        }

        /* Minimalist Modern Footer */
        footer {
            text-align: center;
            padding: 2.5rem;
            background-color: rgba(0, 0, 0, 0.8);
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        footer p {
            margin-bottom: 0.4rem;
        }

        .footer-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s ease;
            border-bottom: 1px solid transparent;
        }

        .footer-link:hover {
            opacity: 0.7;
            border-bottom-color: #ffffff;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>TurboV Gaming Network</h1>
        <p>Your Ultimate Gaming Community</p>
    </header>

    <!-- Main Content Container -->
    <div class="container">
        
        <!-- Game Servers Section -->
        <section id="servers">
            <h2 class="section-title">Game Servers</h2>
            
            <div class="servers-grid">
                <!-- Australian Roleplay Card -->
                <div class="server-card">
                    <img src="aurp.png" alt="Australian Roleplay Logo" class="server-logo">
                    <h3>Australian Roleplay</h3>
                    <p class="subtitle">FiveM / GTARP</p>
                    <div class="card-buttons">
                        <a href="https://cfx.re/join/5ooy8lr" class="btn" target="_blank">Connect Now</a>
                        <a href="https://discord.gg/CVedgwW4W4" class="btn btn-discord" target="_blank">Join Discord</a>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; TurboV Gaming Network. All rights reserved.</p>
        <p><a href="https://discord.gg/Vav64w87Sd" class="footer-link" target="_blank">TurboV Network Discord Server</a></p>
    </footer>

</body>
</html>
