            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .discord-btn:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
        }

        .discord-btn:active {
            transform: translateY(0);
        }

            width: 24px;
            height: 24px;
