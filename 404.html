<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Lost in the Dark</title>
    <style>
        /* ==========================================================================
           Base Styles & Variables
           ========================================================================== */
        :root {
            --bg-color: #0a0a0a;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --accent-red: #ff2a4b;
            --accent-red-glow: rgba(255, 42, 75, 0.4);
            --border-color: #222222;
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ==========================================================================
           Background Ambient Animations
           ========================================================================== */
        .glow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .red-pulse {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-red-glow) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            transition: transform 0.15s ease-out;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        /* ==========================================================================
           Main Content Structure
           ========================================================================== */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        .divider {
            width: 60px;
            height: 3px;
            background-color: var(--accent-red);
            margin: 1.5rem auto;
            box-shadow: 0 0 10px var(--accent-red);
        }

        .headline {
            font-size: 1.25rem;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .subtext {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* ==========================================================================
           Interactive Buttons
           ========================================================================== */
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: 1px solid var(--text-main);
        }

        .btn-primary:hover {
            background-color: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
            box-shadow: 0 0 15px var(--accent-red-glow);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        /* ==========================================================================
           Animations
           ========================================================================== */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 480px) {
            .error-code { font-size: 5.5rem; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="glow-container">
        <div class="red-pulse"></div>
    </div>

    <main class="container">
        <div class="glitch-wrapper">
            <h1 class="error-code" data-text="404">404</h1>
        </div>
        
        <div class="divider"></div>

        <h2 class="headline">SYSTEM ERROR: PAGE NOT FOUND</h2>
        <p class="subtext">
            The void consumed this URL, or maybe it never existed in the first place.
        </p>

        <div class="actions">
            <a href="/" class="btn btn-primary">Return to Safety</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </main>

    <script>
        // Subtle dynamic mouse light effect
        document.addEventListener('mousemove', (e) => {
            const pulse = document.querySelector('.red-pulse');
            const x = e.clientX;
            const y = e.clientY;
            pulse.style.transform = `translate(${x - 150}px, ${y - 150}px)`;
        });
    </script>
</body>
</html>
