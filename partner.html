<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboV - Notice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.5;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            background-color: #334155;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">TurboV</div>
        <h1>Sorry, but TurboV has temporarily shutdown due to harassment.</h1>
        <div class="divider"></div>
        <p>Email <a href="mailto:support@turbov.dev">support@turbov.dev</a> if support is needed.</p>
    </div>

</body>
</html>
