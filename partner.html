<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TurboV - Partners</title>
    <link rel="icon" type="image/jpeg" href="dev.jpg">
    
    <meta name="description" content="TurboV Partners - Collaborate with supercharged hosting and development solutions.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="TurboV">

    <meta property="og:title" content="TurboV | Partners">
    <meta property="og:description" content="Apply for a partnership with TurboV.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="dev.jpg">
    <meta property="og:site_name" content="TurboV">
    <meta name="theme-color" content="#00f2fe"> 
    
    <style>
        /* Color Palette & Base Styles */
        :root {
            --bg-dark: #0b141a;
            --card-bg: rgba(19, 34, 44, 0.9);
            --primary-teal: #00f2fe;
            --accent-blue: #0072ff;
            --text-light: #e2f1f8;
            --text-muted: #8ca3b1;
            --border-color: #1e3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 2rem 0;
        }

        /* Main Container */
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--primary-teal), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .brand-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 3rem;
        }

        /* Action Card Layout */
        .cta-card {
            background: linear-gradient(145deg, var(--card-bg), #0e1b24);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
        }

        .cta-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        .no-partners-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .cta-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        .btn-quote {
            width: 100%;
            max-width: 280px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
            display: inline-block;
        }

        .btn-quote:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
            background: linear-gradient(135deg, var(--primary-teal), var(--accent-blue));
        }

        /* Bottom Navigation Area */
        .footer-nav {
            margin-top: 3rem;
        }

        .btn-reviews {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: inline-block;
        }

        .btn-reviews:hover {
            transform: translateY(-2px);
            border-color: var(--primary-teal);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.15);
        }

        /* Modal Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 10, 14, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-teal);
            padding: 2.5rem;
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .modal-header h3 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1rem;
            color: #ffffff;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-teal);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Form Buttons */
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-teal), var(--accent-blue));
            color: var(--bg-dark);
            font-weight: 700;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-title">TurboV Partners!</h1>
        <p class="brand-subtitle">Collaborate & Grow Together</p>

        <div class="cta-card">
            <p class="no-partners-msg">Sorry but we dont have any partners yet!</p>
            <div class="cta-buttons">
                <button class="btn-quote" id="openModalBtn">Apply for a partnership</button>
            </div>
        </div>

        <div class="footer-nav">
            <a href="https://www.turbov.dev" class="btn-reviews">Home</a>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Partnership Application</h3>
            </div>
            
            <form id="partnerForm">
                <div class="form-group">
                    <label for="partnerEmail">What is you're email?</label>
                    <input type="email" id="partnerEmail" class="form-control" placeholder="name@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="partnerReason">Why do you think we should partner up with you/you're company?</label>
                    <textarea id="partnerReason" class="form-control" placeholder="Tell us about yourself or your company and your goals..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="closeModalBtn">Cancel</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Submit App</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modalOverlay = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const partnerForm = document.getElementById('partnerForm');
        const submitBtn = document.getElementById('submitBtn');

        // Webhook configuration URL
        const webhookUrl = "https://discord.com/api/webhooks/1522461394228875325/nQWwgLanvEzRppQV2Xqo5XE57oEooWsgwLD9MnH0Yp0KkULhdxg32pZq13AeyhR1ZtRY";

        // Open Modal
        openModalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        // Close Modal via Cancel Button
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            partnerForm.reset();
        });

        // Close Modal via clicking on Background Overlay
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
                partnerForm.reset();
            }
        });

        // Form Submit Handler
        partnerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('partnerEmail').value;
            const reason = document.getElementById('partnerReason').value;

            submitBtn.textContent = "Sending...";
            submitBtn.disabled = true;

            const payload = {
                embeds: [{
                    title: "🤝 New Partnership Application",
                    color: 62206, 
                    fields: [
                        { name: "📧 Applicant Email", value: email, inline: false },
                        { name: "💡 Partnership Reason", value: reason, inline: false }
                    ],
                    timestamp: new Date().toISOString(),
                    footer: { text: "TurboV Partnership Management System" }
                }]
            };

            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert("Your partnership application has been sent successfully!");
                } else {
                    alert("There was an issue submitting your application. Please try again later.");
                }
            })
            .catch(error => {
                console.error("Error sending webhook application:", error);
                alert("An error occurred. Please check your network logs.");
            })
            .finally(() => {
                submitBtn.textContent = "Submit App";
                submitBtn.disabled = false;
                modalOverlay.classList.remove('active');
                partnerForm.reset();
            });
        });
    </script>

</body>
</html>
